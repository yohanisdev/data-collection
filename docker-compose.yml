services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gedeuffa
      POSTGRES_USER: gedeuffa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gedeuffa"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: .
    env_file: .env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://gedeuffa:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/gedeuffa
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["5000:5000"]
    command: ["sh", "-c", "flask --app backend db upgrade && gunicorn -w 3 -b 0.0.0.0:5000 'backend:create_app()'"]
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm ci && npm run dev"
    environment:
      VITE_BACKEND_PROXY: http://backend:5000
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  pgdata:
